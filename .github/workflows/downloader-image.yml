name: 构建云端下载器

on:
  push:
    branches: [main]
    paths:
      - services/cobalt-render/**
      - .github/workflows/downloader-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: downloader-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建并发布 Docker 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并发布
        uses: docker/build-push-action@v6
        with:
          context: ./services/cobalt-render
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/jackshaw0317-debug/chaipian-ai-downloader:latest
            ghcr.io/jackshaw0317-debug/chaipian-ai-downloader:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

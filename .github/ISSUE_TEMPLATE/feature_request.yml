name: 功能建议
description: 提议新的内容工作流、体验改进或兼容能力
title: "[建议] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的真实问题
      description: 请先描述使用场景和阻碍，不要只描述按钮或实现方式。
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 希望得到的结果
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方法
      description: 你现在如何完成这件事？有哪些不足？

  - type: dropdown
    id: audience
    attributes:
      label: 主要使用者
      multiple: true
      options:
        - 个人创作者
        - 内容运营
        - 品牌或营销团队
        - 代理商
        - 开发者
        - 其他

  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 该建议不依赖绕过登录、付费或版权保护
          required: true
